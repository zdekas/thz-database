<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – THz transmission database</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page">
  <form id="login" class="card narrow">
    <h1>Log in</h1>
    <label>E-mail <input id="email" type="email" autocomplete="username" required autofocus></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <p id="message" class="error" role="alert"></p>
    <div class="actions">
      <button class="primary" type="submit">Log in</button>
      <a href="/">Back to the database</a>
    </div>
  </form>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "/new";
    document.getElementById("login").onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.value, password: password.value }),
      });
      if (r.ok) location.href = /^\/(?!\/)/.test(next) ? next : "/new";
      else message.textContent = (await r.json()).detail || "Login failed.";
    };
  </script>
</body>
</html>
